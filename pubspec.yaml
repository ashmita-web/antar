name: antar
description: "AI for Digital Public Infrastructure & Governance — citizen voice meets data-driven policy."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Persistence
  shared_preferences: ^2.5.3

  # Typography
  google_fonts: ^6.2.1

  # Animation
  animations: ^2.0.11

  # Charts
  fl_chart: ^0.70.2

  # Maps
  google_maps_flutter: ^2.12.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # PDF
  pdf: ^3.11.2
  printing: ^5.14.2

  # Audio
  record: ^5.2.1
  flutter_tts: ^4.2.0

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5

  # UI helpers
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.1.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/fonts/
    - assets/i18n/

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2E3A87"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
